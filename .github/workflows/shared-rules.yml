name: Shared rules check
run-name: "${{ github.workflow }} · ${{ github.ref_name }}: ${{ github.event.head_commit.message || github.event.pull_request.title || github.workflow }}"

# The build ignores the documents and leases a machine, so a change to the documents alone is
# checked here, with nothing leased: the shared rules block must still fit the hash its markers
# carry, no page or source may cite an issue, and the tests that read a document must pass. Every
# push, since a citation can land in any file.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: The shared rules are unchanged copies, nothing cites an issue, and the documents hold
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/pinned-jdk

      - name: Check that the shared rules are unchanged copies
        run: java -cp "$(cat build/jdk-cp.txt)" org.fuin.sokar.release.Main check-shared AGENTS.md

      - name: Check the citations, the documentation site and the READMEs
        run: |
          java -cp "$(cat build/jdk-cp.txt)" org.fuin.sokar.release.Main check-citations .
          java -cp "$(cat build/jdk-cp.txt)" org.fuin.sokar.release.Main check-readmes .
          java -cp "$(cat build/jdk-cp.txt)" org.fuin.sokar.release.Main check-doc-site doc mkdocs.yml

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Run the tests that read a document
        run: flutter test --tags documents
