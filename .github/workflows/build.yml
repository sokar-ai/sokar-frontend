name: Build

# The same shape as the backend's release, deliberately: one workflow, two jobs, publishing to a
# `snapshots` distribution. A consumer puts that word in their sources.list, so snapshots and a
# future stable release can never mix.
#
# `workflow_dispatch` ignores the path filter, so a run can always be forced.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Action majors are kept current, not pinned and forgotten: GitHub deprecated the Node 20 runtime
# on 2025-09-19 and began forcing those actions onto Node 24, which is a warning today and a
# failure whenever they stop forcing it. Checked against the published tags on 2026-09-08.

jobs:
  build:
    name: Test and package
    # The oldest distribution this interface is meant to install on, and not a preference: the
    # Flutter bundle links the system GTK3 stack, so **the build machine sets the floor**. Built on
    # 24.04 the package refuses to install on 22.04, and the failure arrives at somebody else's
    # `apt`. Raising this is a decision about who can no longer install, not a maintenance chore —
    # and the same runner is used for the other two jobs so nothing is built against a newer GTK
    # by accident.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      # Maven drives the build, so the runner needs a JDK as well as Flutter.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # GTK and the toolchain, which the runner has by default in neither case. The third-party
      # lists go first: `apt-get update` exits 100 when any index fails, and everything installed
      # here is Ubuntu's own. Chrome's cost run 93144262860.
      - name: Install what a Linux desktop build needs
        run: |
          sudo rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev dpkg-dev binutils rpm

      - name: Get dependencies
        run: flutter pub get

      # Generated tests are committed, so CI proves they are current rather than trusting that
      # somebody ran the generator. A diff here means a .feature was edited and not regenerated.
      - name: Prove the generated tests are current
        run: |
          dart run build_runner build
          git diff --exit-code test/features integration_test || {
            echo "::error::a .feature changed without build_runner being run" >&2
            exit 1
          }

      # Maven runs pub get, analyze, the tests and the release build. `set +e` so a red run still
      # reports; the report's exit code and Maven's both fail the job.
      - name: Build and test
        run: |
          set +e
          ./mvnw -B verify
          built=$?
          set -e
          dart tool/test_report.dart
          exit $built

      - name: Package
        run: |
          curl -sSL -o nfpm.tar.gz \
            https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_x86_64.tar.gz
          tar xzf nfpm.tar.gz nfpm
          # Each build supersedes the last, or a repository called `snapshots` never updates
          # anybody. Locally this defaults to 0.
          NFPM="$PWD/nfpm" SNAPSHOT_RUN="${{ github.run_number }}" tool/package.sh

      # What was built, named once. The backend learned this the hard way: two lists of files drift,
      # and the symptom is a publish failing after the tests have already passed.
      - name: Say what was built
        run: |
          ls -1 build/packages/*.deb build/packages/*.rpm > build/packages/fetched.txt
          cat build/packages/fetched.txt

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            build/packages/*.deb
            build/packages/*.rpm
            build/packages/fetched.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            build/test-results.xml
            build/test-report.html

  # Against a machine rented for the run: Maven leases it, the GUI tests run headless over ssh,
  # and the sweep takes it down whether they passed or not. Not a gate for publishing: a rented
  # machine that cannot be had is not a fault in this interface.
  integration:
    name: Test against a leased machine
    runs-on: ubuntu-22.04
    # A fork's pull request gets no secrets, and would rent nothing.
    if: github.event_name != 'pull_request'
    env:
      # With GITHUB_RUN_ID this names the run, so the last step sweeps what this run leased.
      SOKAR_CI_LEG: frontend-e2e
      HETZNER_API: ${{ secrets.HETZNER_API }}
      # The key as material, never written to a file: the lease and tool/e2e.sh both read it.
      HETZNER_SSH: ${{ secrets.HETZNER_SSH }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install what a headless desktop test needs
        run: |
          sudo rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev xvfb

      # Before anything is rented, so the sweep at the end always has a tool to run.
      - name: Resolve the machine tool
        run: |
          mkdir -p build
          ./mvnw -B -q -s settings.xml -Phetzner dependency:build-classpath \
            -Dmdep.outputFile=build/cp.txt

      - name: Lease, test and sweep
        run: |
          set +e
          ./mvnw -B -s settings.xml verify -Pe2e,hetzner -DskipTests
          built=$?
          set -e
          dart tool/test_report.dart build/e2e-results.json build/e2e-report.html \
            build/e2e-results.xml --heading=Integration --against="a real machine, over ssh"
          exit $built

      # The net under Maven's own sweep: whatever this run leased, whatever failed on the way.
      - name: Sweep anything this run leased
        if: always()
        run: |
          test -s build/cp.txt || { echo "::warning::the machine tool was never resolved"; exit 0; }
          java -cp "$(cat build/cp.txt)" org.fuin.sokar.machines.Main sweep --mine

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-reports
          path: |
            build/e2e-results.xml
            build/e2e-report.html

  installs:
    name: Prove the packages install
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        image: [debian:12, fedora:40]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      # A package that does not install is worth catching here rather than in somebody's apt. The
      # container is clean, so a dependency that was only ever satisfied by the build machine
      # fails loudly.
      - name: Install it in a clean ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/packages:/packages" ${{ matrix.image }} sh -c '
            set -e
            if command -v apt-get >/dev/null; then
              apt-get update
              apt-get install -y /packages/*.deb
              test -x /usr/bin/sokar-frontend
              test -f /usr/lib/sokar-frontend/lib/libapp.so
              test -f /usr/lib/sokar-frontend/data/icudtl.dat
            else
              dnf install -y /packages/*.rpm
              test -x /usr/bin/sokar-frontend
              test -f /usr/lib/sokar-frontend/lib/libapp.so
              test -f /usr/lib/sokar-frontend/data/icudtl.dat
            fi
            test -f /usr/share/applications/sokar-frontend.desktop
          '

  publish:
    name: Publish to Artifactory
    needs: [build, installs]
    runs-on: ubuntu-22.04
    # A pull request from a fork has no access to the token, and a run that publishes nothing is
    # better than one that fails at the last step.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      # The manifest is checked rather than trusted: the file list lives in one place, and this is
      # where it is proven to still describe what arrived.
      - name: Check everything the build said it made is here
        run: |
          while read -r built; do
            file="packages/$(basename "$built")"
            test -f "$file" || { echo "::error::$file is missing" >&2; exit 1; }
          done < packages/fetched.txt

      - uses: jfrog/setup-jfrog-cli@v5
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        with:
          # Otherwise it writes build-info to a repository this token cannot write, and warns on
          # every run.
          disable-auto-build-publish: true

      # `--target-props` is not optional. Without them Artifactory **stores the file and never
      # indexes it**: apt sees nothing and no error appears anywhere. Setting properties needs
      # Annotate permission as well as Deploy — and without Annotate the upload still succeeds and
      # the properties are silently dropped, which is why `artifactory-probe.yml` exists.
      #
      # `--flat=true`, or the source directory travels and the package lands under
      # `pool/main/s/sokar-frontend/packages/...`.
      - name: Upload the deb
        run: |
          jf rt upload "packages/*.deb" "sokar-dist-deb/pool/main/s/sokar-frontend/" \
            --flat=true \
            --target-props="deb.distribution=snapshots;deb.component=main;deb.architecture=amd64"

      - name: Upload the rpm
        run: |
          jf rt upload "packages/*.rpm" "sokar-dist-rpm/snapshots/" --flat=true

      # An upload that succeeded is not a package anybody can install. Artifactory indexes
      # asynchronously, and **a missing index, an empty index and a late index look identical from
      # a client** — measured on 2026-09-08, when the Debian index went 404, then 200 with an empty
      # Packages file, then 404 again inside twelve minutes. A single probe of an asynchronous
      # index is not a measurement, so this retries before it believes the answer.
      #
      # This is the other half of the `--target-props` lesson: the properties being *passed* is
      # asserted by a test, and the package being *indexed* can only be seen from outside.
      - name: Wait until it is actually indexed
        run: |
          set -u
          # `JF_URL` is the **platform** url — `https://…jfrog.io` — and the `jf` CLI appends
          # `/artifactory` itself. Raw curl does not, which is why the first version of this step
          # spent two minutes asking a 404 and the second blamed a trailing slash it had never
          # measured. Normalised both ways so either shape works.
          base="${{ vars.JF_URL }}"
          while [ "${base%/}" != "$base" ]; do base="${base%/}"; done
          base="${base%/artifactory}"
          test -n "$base" || { echo "::error::vars.JF_URL is not set" >&2; exit 1; }
          base="$base/artifactory"

          version="$(dpkg-deb -f packages/*.deb Version)"
          test -n "$version" || { echo "::error::could not read the built version" >&2; exit 1; }

          deb="$base/sokar-dist-deb/dists/snapshots/main/binary-amd64/Packages"
          rpm="$base/sokar-dist-rpm/snapshots/repodata/repomd.xml"
          echo "looking for $version"
          echo "  $deb"
          echo "  $rpm"

          found_deb=no
          found_rpm=no
          for attempt in $(seq 1 20); do
            if [ "$found_deb" = no ] && \
               curl -fsSL "$deb" 2>/dev/null | grep -q "^Version: $version$"; then
              found_deb=yes
              echo "the deb index carries $version"
            fi
            if [ "$found_rpm" = no ]; then
              primary="$(curl -fsSL "$rpm" 2>/dev/null \
                | grep -oE 'repodata/[a-f0-9]+-primary.xml.gz' | head -1)"
              if [ -n "$primary" ] && curl -fsSL "$base/sokar-dist-rpm/snapshots/$primary" \
                   2>/dev/null | gunzip -c | grep -q "<name>sokar-frontend</name>"; then
                found_rpm=yes
                echo "the rpm index carries sokar-frontend"
              fi
            fi
            if [ "$found_deb" = yes ] && [ "$found_rpm" = yes ]; then exit 0; fi
            sleep 6
          done

          # What it asked and what came back, rather than a cause it cannot know. The first
          # version of this asserted the token lacked Annotate; the packages were indexed and the
          # URL was wrong.
          echo "deb index: HTTP $(curl -sSL -o /dev/null -w '%{http_code}' "$deb")"
          echo "rpm index: HTTP $(curl -sSL -o /dev/null -w '%{http_code}' "$rpm")"
          curl -fsSL "$deb" 2>/dev/null | grep '^Version:' | sed 's/^/  in the index: /' || true
          echo "::error::uploaded but not indexed after two minutes" \
               "(deb: $found_deb, rpm: $found_rpm). The packages are stored and nothing can" \
               "install them. What was asked for and what came back is above." >&2
          exit 1
